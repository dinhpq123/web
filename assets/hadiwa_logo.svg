<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Main gradient for shield/hexagon -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0050CC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00C8FF;stop-opacity:1" />
    </linearGradient>
    <!-- Inner glow gradient -->
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00E5FF;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#0066FF;stop-opacity:0.7" />
    </linearGradient>
    <!-- Background fill -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#0a2040;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#061428;stop-opacity:1" />
    </radialGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Outer glow for icon -->
    <filter id="outerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded background -->
  <rect width="200" height="200" rx="28" fill="url(#bgGrad)"/>

  <!-- Outer ring glow -->
  <path d="M100 16 L164 54 L164 130 L100 168 L36 130 L36 54 Z"
        fill="none" stroke="#00C8FF" stroke-width="1.5" opacity="0.3"/>

  <!-- Main hexagon shield -->
  <path d="M100 22 L158 57 L158 127 L100 162 L42 127 L42 57 Z"
        fill="url(#shieldGrad)" opacity="0.15"/>
  <path d="M100 22 L158 57 L158 127 L100 162 L42 127 L42 57 Z"
        fill="none" stroke="url(#shieldGrad)" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Inner hexagon -->
  <path d="M100 38 L146 63 L146 113 L100 138 L54 113 L54 63 Z"
        fill="rgba(0,200,255,0.06)"/>

  <!-- Water drop icon (center of hexagon) -->
  <!-- Drop body -->
  <path d="M100 54 C100 54 76 84 76 100 C76 114 87 124 100 124 C113 124 124 114 124 100 C124 84 100 54 100 54 Z"
        fill="url(#innerGrad)" filter="url(#outerGlow)"/>

  <!-- Wave accent inside drop -->
  <path d="M82 106 C87 101 92 108 97 103 C102 98 107 105 112 100"
        fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M84 112 C89 107 94 114 99 109 C104 104 109 111 114 106"
        fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round"/>

  <!-- Shine highlight on drop -->
  <ellipse cx="91" cy="72" rx="5" ry="8" fill="rgba(255,255,255,0.35)" transform="rotate(-20 91 72)"/>

  <!-- Bottom text: HADIWA -->
  <text x="100" y="182" text-anchor="middle"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="22" font-weight="800" letter-spacing="4"
        fill="url(#shieldGrad)" filter="url(#glow)">HADIWA</text>

  <!-- Sub text: IOC -->
  <text x="100" y="198" text-anchor="middle"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="9" font-weight="500" letter-spacing="5"
        fill="rgba(0,200,255,0.6)">IOC</text>
</svg>
