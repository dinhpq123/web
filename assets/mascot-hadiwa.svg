<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0050CC"/>
      <stop offset="100%" style="stop-color:#00A8CC"/>
    </linearGradient>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003DA0"/>
      <stop offset="100%" style="stop-color:#0070CC"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00E5FF;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0050CC;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="eyeGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#00F0FF"/>
      <stop offset="100%" style="stop-color:#0040CC"/>
    </radialGradient>
    <filter id="robotGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Antenna -->
  <line x1="60" y1="8" x2="60" y2="20" stroke="#00C8FF" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="60" cy="6" r="4" fill="#00C8FF" filter="url(#robotGlow)"/>
  <!-- Antenna glow dot -->
  <circle cx="60" cy="6" r="2" fill="#ffffff" opacity="0.8"/>

  <!-- Water drop hat on top of head - Vietnamese nón lá inspired -->
  <path d="M60 12 C50 18 35 28 32 32 L88 32 C85 28 70 18 60 12 Z"
        fill="url(#glowGrad)" opacity="0.85"/>
  <path d="M60 12 C50 18 35 28 32 32 L88 32 C85 28 70 18 60 12 Z"
        fill="none" stroke="#00E5FF" stroke-width="1" opacity="0.6"/>

  <!-- Head (rounded rectangle) -->
  <rect x="34" y="30" width="52" height="42" rx="14" fill="url(#headGrad)" stroke="#00C8FF" stroke-width="1.5"/>

  <!-- Head highlight -->
  <rect x="38" y="33" width="44" height="16" rx="8" fill="rgba(255,255,255,0.07)"/>

  <!-- Eyes area (face plate) -->
  <rect x="40" y="38" width="40" height="22" rx="9" fill="rgba(0,5,20,0.7)" stroke="rgba(0,200,255,0.3)" stroke-width="1"/>

  <!-- Left eye -->
  <circle cx="51" cy="49" r="7" fill="url(#eyeGrad)" filter="url(#robotGlow)"/>
  <circle cx="51" cy="49" r="4.5" fill="#001830"/>
  <circle cx="51" cy="49" r="3" fill="#00E5FF" opacity="0.9"/>
  <circle cx="49.5" cy="47.5" r="1" fill="white" opacity="0.9"/>

  <!-- Right eye -->
  <circle cx="69" cy="49" r="7" fill="url(#eyeGrad)" filter="url(#robotGlow)"/>
  <circle cx="69" cy="49" r="4.5" fill="#001830"/>
  <circle cx="69" cy="49" r="3" fill="#00E5FF" opacity="0.9"/>
  <circle cx="67.5" cy="47.5" r="1" fill="white" opacity="0.9"/>

  <!-- Smile mouth -->
  <path d="M49 60 Q60 68 71 60" fill="none" stroke="#00C8FF" stroke-width="2" stroke-linecap="round" opacity="0.9"/>

  <!-- Ear nubs -->
  <rect x="28" y="38" width="8" height="14" rx="4" fill="url(#bodyGrad)" stroke="#00C8FF" stroke-width="1"/>
  <rect x="84" y="38" width="8" height="14" rx="4" fill="url(#bodyGrad)" stroke="#00C8FF" stroke-width="1"/>
  <!-- Ear lights -->
  <circle cx="32" cy="42" r="2" fill="#00C8FF" opacity="0.8"/>
  <circle cx="88" cy="42" r="2" fill="#00C8FF" opacity="0.8"/>

  <!-- Neck -->
  <rect x="54" y="72" width="12" height="8" rx="3" fill="url(#bodyGrad)"/>

  <!-- Body -->
  <rect x="30" y="80" width="60" height="34" rx="12" fill="url(#bodyGrad)" stroke="#00C8FF" stroke-width="1.5"/>

  <!-- Body panel lights -->
  <rect x="42" y="88" width="8" height="5" rx="2" fill="#00E5FF" opacity="0.7"/>
  <rect x="56" y="88" width="8" height="5" rx="2" fill="#00C8FF" opacity="0.5"/>
  <rect x="70" y="88" width="8" height="5" rx="2" fill="#00E5FF" opacity="0.7"/>

  <!-- Water wave on chest -->
  <path d="M38 100 C43 96 48 103 53 99 C58 95 63 102 68 98 C73 94 78 101 83 97"
        fill="none" stroke="rgba(0,229,255,0.7)" stroke-width="2" stroke-linecap="round"/>

  <!-- Body highlight -->
  <rect x="34" y="83" width="52" height="10" rx="6" fill="rgba(255,255,255,0.06)"/>

  <!-- Arms -->
  <!-- Left arm -->
  <rect x="14" y="82" width="18" height="10" rx="5" fill="url(#bodyGrad)" stroke="#00C8FF" stroke-width="1"/>
  <!-- Right arm -->
  <rect x="88" y="82" width="18" height="10" rx="5" fill="url(#bodyGrad)" stroke="#00C8FF" stroke-width="1"/>

  <!-- Outer glow ring -->
  <circle cx="60" cy="60" r="56" fill="none" stroke="rgba(0,200,255,0.08)" stroke-width="2"/>
</svg>
